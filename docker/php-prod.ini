; PHP de l'image de production (Dockerfile, cible « production »).

; Le code ne change qu'en reconstruisant l'image : OPcache ne relit jamais les fichiers.
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
realpath_cache_size=4096K
realpath_cache_ttl=600

; Les erreurs vont dans les journaux du conteneur, jamais dans la page.
display_errors=Off
log_errors=On
error_log=/dev/stderr
expose_php=Off

memory_limit=256M
