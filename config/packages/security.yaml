security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Account\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # 5 failed logins (same account, same address) and the form waits a quarter of an
            # hour: the administration is on the public address, a robot can't try much.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            # Refuses disabled accounts at login.
            user_checker: App\Account\Security\UserChecker

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # Always the home page after logging in. Otherwise Symfony goes back to the last
                # address refused while logged out, which can be a request of the player
                # (/favorites/state…) sent right at logout: the login then seemed to fail.
                always_use_default_target_path: true
            logout:
                path: app_logout
                enable_csrf: true

            # "Se souvenir de moi": a signed cookie that logs back in when the session is gone
            # (PHP deletes idle sessions after 24 min, Android kills Firefox in background).
            # It holds the password hash: changing the password invalidates it everywhere.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
                signature_properties: ['password']

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
         - { path: ^/login, roles: PUBLIC_ACCESS }
         # "Mot de passe oublié ?" and the "choose your password" page of the email link.
         - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
         - { path: ^/reset-password, roles: PUBLIC_ACCESS }
         - { path: ^/admin, roles: ROLE_ADMIN }
         - { path: ^/, roles: ROLE_USER }
