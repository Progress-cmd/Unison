monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

# Dev: everything in the container's logs (docker compose logs app), as before Monolog,
# without the "event notified" lines that drown the rest.
when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: php://stderr
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

# Prod: silence while all goes well. As soon as a request (or an import in the worker) hits
# an error, its whole story is written out — the 50 lines that came before, debug included —
# to the container's logs (sudo docker logs unison-app / unison-worker). The errors
# themselves also land on the admin's Erreurs page (ServerErrorListener, ImportFailureListener).
when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                # A missing page or a refused address isn't a breakdown.
                excluded_http_codes: [400, 404, 405]
                channels: ["!deprecation", "!event"]
                buffer_size: 50
            nested:
                type: stream
                path: php://stderr
                level: debug
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
